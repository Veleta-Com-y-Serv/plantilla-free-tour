  guia:
    activa: true
    antetitulo: Tu guía
    titulo: "Soy Uxía y esta ciudad es mi casa"
    texto: "Nací en la Rúa Nova y llevo doce años enseñando Santiago a gente de todas partes. Estudié Historia del Arte aquí mismo y soy guía oficial de turismo de Galicia.\n\nNo me sé la ciudad de memoria: me la sé de vivirla. Te cuento lo que dicen los libros, lo que se cuenta en los bares y por qué aquí nadie sale de casa sin paraguas."
    imagen: /fotos/guia.jpg
    items:
      - { titulo: Guía oficial de turismo de Galicia, icono: insignia }
      - { titulo: "Castellano, gallego e inglés", icono: idiomas }
      - { titulo: Grupos pequeños y sin prisas, icono: usuarios }
    personas:
      - { nombre: Uxía Barreiro, cargo: "Guía y fundadora", foto: /placeholders/persona.svg, texto: "Hace los tours de día, el del mercado y las visitas privadas." }
      - { nombre: Brais Lago, cargo: "Guía de los tours en inglés y de noche", foto: /placeholders/persona.svg, texto: "Historiador y contador de leyendas. Si hay niebla, mejor." }
    cta: { texto: Pregúntame lo que quieras, url: "/#contacto" }

  que-veras:
    activa: true
    antetitulo: Qué verás
    titulo: Las paradas del camino
    texto: "Seis lugares por los que pasamos en los tours. Cada uno tiene su historia y alguno, su leyenda."
    items:
      - { titulo: Praza do Obradoiro, texto: "La fachada de la catedral y el sitio donde terminan el Camino miles de peregrinos.", imagen: /fotos/parada-1.jpg }
      - { titulo: Praza da Quintana, texto: "La Puerta Santa y la sombra del peregrino que solo se ve de noche.", imagen: /fotos/parada-2.jpg }
      - { titulo: Rúa do Franco, texto: "La calle de los vinos y las tapas, con siglos de peregrinos a la espalda.", imagen: /fotos/parada-3.jpg }
      - { titulo: Mercado de Abastos, texto: "Naves de granito, placeras y el mejor producto gallego.", imagen: /fotos/parada-4.jpg }
      - { titulo: Parque da Alameda, texto: "La vista de postal de la catedral desde el paseo de la Ferradura.", imagen: /fotos/parada-5.jpg }
      - { titulo: San Martiño Pinario, texto: "Un monasterio gigantesco escondido detrás de la catedral.", imagen: /fotos/parada-6.jpg }

  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que cuentan al terminar
    testimonios:
      - { texto: "Llovía a mares y aun así fue lo mejor del viaje. Uxía consigue que te enamores de cada piedra.", autor: Carmen R., nota: "Free tour por la zona vieja, marzo de 2026" }
      - { texto: "El tour de leyendas con Brais pone los pelos de punta. Mis hijos no han dejado de hablar de la Santa Compaña.", autor: Familia Ortega, nota: "Leyendas y misterios, agosto de 2025" }
      - { texto: "Probamos cosas en el mercado que solos nunca habríamos pedido. Y salimos con la lista de dónde cenar.", autor: Javier y Ana, nota: "Mercado de Abastos y tapas, mayo de 2026" }
      - { texto: "Very clear, very fun and never boring. Best way to start our stay in Santiago.", autor: Emma T., nota: "Old Town free tour, junio de 2026" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de venir
    preguntas:
      - { pregunta: "¿De verdad el free tour es gratis?", respuesta: "Reservar no cuesta nada y no pagas por adelantado. Al terminar, cada persona deja la propina que cree que vale el tour. Si no te ha gustado, no pasa nada." }
      - { pregunta: "¿Cuánto se suele dejar de propina?", respuesta: "Lo que te parezca justo. No hay mínimo ni te voy a mirar mal. Se puede pagar en efectivo o con el móvil." }
      - { pregunta: "¿Hace falta reservar?", respuesta: "Sí, aunque sea gratis: así sé cuántos vamos y mantengo los grupos pequeños. Si no puedes venir, avísame por WhatsApp y dejas la plaza a otra persona." }
      - { pregunta: "¿Qué pasa si llueve?", respuesta: "En Santiago la lluvia es parte del paisaje: el tour sale igual y buscamos soportales. Solo lo suspendo con aviso de temporal, y te escribo antes." }
      - { pregunta: "¿Se puede ir con carrito o silla de ruedas?", respuesta: "Sí en el free tour por la zona vieja y en el de la Alameda, con algún tramo de piedra irregular. Dímelo al reservar y adapto el recorrido." }
      - { pregunta: "¿Hacéis visitas para grupos o colegios?", respuesta: "Sí, con la visita privada para grupos. Cuéntame cuántos sois, la edad y qué os interesa, y te paso el precio cerrado." }

