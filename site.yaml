secciones:
  hero:
    activa: true
    antetitulo: Free tours en Santiago de Compostela
    titulo: Santiago se entiende andando.
    texto: "Soy Uxía, guía de turismo y compostelana. Te enseño la ciudad vieja a pie, en grupos pequeños y sin prisa. Reservas gratis y al final pagas lo que creas que vale."
    imagen: /fotos/hero.jpg
    sello: "Reserva gratis · Paga con propina ·"
    items:
